<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hardware Hackathon Radar Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#0D1F2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.55"/>

  <!-- Subtle PCB traces on left -->
  <g stroke="#1E3A5F" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M 0 68 H 84 L 112 96 H 170"/>
    <path d="M 0 228 H 100 L 128 200 H 196"/>
    <circle cx="170" cy="96" r="4" fill="#38BDF8" stroke="none"/>
    <circle cx="196" cy="200" r="4" fill="#34D399" stroke="none"/>
  </g>

  <!-- Radar motif on right -->
  <g transform="translate(990, 150)">
    <circle r="115" fill="url(#radarGlow)"/>
    <circle r="102" fill="none" stroke="#1E3A5F" stroke-width="1.2" stroke-dasharray="4 6"/>
    <circle r="72" fill="none" stroke="#254E70" stroke-width="1.2"/>
    <circle r="42" fill="none" stroke="#2D6A8E" stroke-width="1.2"/>
    <line x1="-112" y1="0" x2="112" y2="0" stroke="#1E3A5F" stroke-width="1"/>
    <line x1="0" y1="-112" x2="0" y2="112" stroke="#1E3A5F" stroke-width="1"/>
    <path d="M 0 0 L 72 -72 A 102 102 0 0 1 102 0 Z" fill="#34D399" opacity="0.16"/>
    <line x1="0" y1="0" x2="72" y2="-72" stroke="#34D399" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
    <circle cx="52" cy="-36" r="5" fill="#34D399"/>
    <circle cx="-48" cy="40" r="4" fill="#F59E0B"/>
    <circle cx="34" cy="56" r="4" fill="#38BDF8"/>
  </g>

  <!-- Title & copy -->
  <g transform="translate(76, 82)">
    <rect x="0" y="-28" width="218" height="24" rx="12" fill="#0F2942" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="14" y="-12" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">OPEN KNOWLEDGE BASE</text>

    <text x="0" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Hardware Hackathon Radar</text>
    <rect x="0" y="54" width="320" height="4" rx="2" fill="url(#accent)"/>

    <text x="0" y="88" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400">
      Robotics · Embodied HMI · Makeathons · Edge-AI Product Playbook
    </text>

    <!-- Bottom pill tags -->
    <g transform="translate(0, 114)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">
      <rect x="0" y="0" width="142" height="28" rx="6" fill="#132238" stroke="#334155"/>
      <text x="14" y="18" fill="#34D399">● Live Deadlines</text>

      <rect x="154" y="0" width="166" height="28" rx="6" fill="#132238" stroke="#334155"/>
      <text x="168" y="18" fill="#7DD3FC">⚙ MakeMIT Patterns</text>

      <rect x="332" y="0" width="186" height="28" rx="6" fill="#132238" stroke="#334155"/>
      <text x="346" y="18" fill="#FBBF24">🤖 Agent-Ready Schema</text>
    </g>
  </g>
</svg>
